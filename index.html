<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font master dimuat sekali di sini; komponen hanya merujuk via --font-sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>PORA — Pekan Olahraga Aceh | Tuan Rumah Aceh Jaya</title>

    <!-- SEO & social default (statis untuk crawler tanpa-JS; ditimpa per-halaman saat runtime). -->
    <meta
      name="description"
      content="Portal resmi PORA Aceh Jaya: berita, jadwal, klasemen medali, venue, dan siaran langsung."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PORA Aceh Jaya" />
    <meta property="og:title" content="PORA — Pekan Olahraga Aceh | Tuan Rumah Aceh Jaya" />
    <meta
      property="og:description"
      content="Portal resmi PORA Aceh Jaya: berita, jadwal, klasemen medali, venue, dan siaran langsung."
    />
    <meta property="og:image" content="/no-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PORA — Pekan Olahraga Aceh | Tuan Rumah Aceh Jaya" />
    <meta
      name="twitter:description"
      content="Portal resmi PORA Aceh Jaya: berita, jadwal, klasemen medali, venue, dan siaran langsung."
    />

    <!-- Terapkan tema sedini mungkin (default GELAP) agar tak ada kedip terang. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var isDark = stored ? stored === "dark" : true;
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
